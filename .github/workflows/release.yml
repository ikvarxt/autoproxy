name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 版本号只有一个出处：Resources/Info.plist 的 CFBundleShortVersionString。
  # 这一步在 ubuntu 上跑是因为 macOS runner 按 10 倍计费，而绝大多数 push
  # 并不伴随版本号变化，没必要为了读一个字符串开 macOS 机器。
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        run: |
          VERSION=$(python3 -c "import plistlib;print(plistlib.load(open('Resources/Info.plist','rb'))['CFBundleShortVersionString'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION 已发布过，跳过"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "要发 v$VERSION"
          fi

  release:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: macos-15
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app bundle
        run: make app VERSION=$VERSION BUILD_NUMBER=${{ github.run_number }}

      - name: Pack
        run: ditto -c -k --keepParent build/AutoProxy.app AutoProxy-$VERSION.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## 安装

          解压后把 `AutoProxy.app` 拖进「应用程序」，然后去掉隔离属性：

          ```bash
          xattr -dr com.apple.quarantine /Applications/AutoProxy.app
          ```

          这一步省不掉：产物是 ad-hoc 签名的，没有 Apple Developer ID，
          从浏览器下载的包会被 Gatekeeper 标记为不可信。

          需要 macOS 13 以上，以及 PATH 里能找到 `adb`。

          ---
          NOTES
          gh release create "v$VERSION" "AutoProxy-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "AutoProxy $VERSION" \
            --notes-file notes.md \
            --generate-notes
